services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dgtt
      POSTGRES_PASSWORD: dgtt
      POSTGRES_DB: dgtt
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgtt -d dgtt"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://dgtt:dgtt@db:5432/dgtt
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ORIGINS: http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
